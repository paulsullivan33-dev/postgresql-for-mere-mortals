site_name: PostgreSQL for Mere Mortals
site_description: Plain-language PostgreSQL. A real database server on a throwaway lab cluster — tables whose constraints refuse bad rows on the record, transactions rolled back and committed, an index measured on half a million rows, permissions denied then granted, and a full dump, drop, and restore with the checksums compared.
site_url: https://paulsullivan33-dev.github.io/postgresql-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, code MIT'

